<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Mock shop (nobody signed in)</title></head>
<body>
<!-- the shape Flipkart really has when nobody is signed in: a Login link in the header (twice), More, Cart, and the phone-number sign-in box with Continue -->
<header>
  <a href="/">Mock Shop</a>
  <input type="text" placeholder="Search for Products, Brands and More" aria-label="Search for Products, Brands and More">
  <a href="/login?ret=/">Login</a>
  <a href="#more">More</a>
  <a href="/viewcart">Cart</a>
</header>
<nav>
  <a href="/m">Mobiles</a> <a href="/f">Fashion</a> <a href="/e">Electronics</a> <a href="/h">Home</a>
  <a href="/a">Appliances</a> <a href="/t">Travel</a> <a href="/o">Offers</a>
</nav>
<div role="dialog" aria-label="Login">
  <h2>Login</h2>
  <p>Get access to your Orders, Wishlist and Recommendations</p>
  <input type="number" placeholder="Phone Number" aria-label="Phone Number">
  <button type="button">Continue</button>
</div>
</body>
</html>
