<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Test Checkout (a busy page)</title>
<style>
  body { font-family: sans-serif; margin: 20px; }
  .bar { width: 240px; height: 10px; background: #ddd; margin: 8px 0; }
  .bar > div { width: 66%; height: 10px; background: #2a7; }
  .card { border: 1px solid #aaa; padding: 10px; margin: 10px 0; width: 340px; }
  button { font-size: 15px; padding: 8px 14px; margin: 4px 6px 4px 0; }
  #spin { width: 28px; height: 28px; border: 4px solid #ccc; border-top-color: #333; border-radius: 50%; }
</style>
</head>
<body>
<h1>Checkout</h1>

<!-- a progress bar that is part of the page (step 2 of 3), not a page still loading -->
<div role="progressbar" aria-label="Checkout progress" aria-valuenow="66" aria-valuemin="0" aria-valuemax="100" class="bar"><div></div></div>
<p>Step 2 of 3: Delivery address</p>

<!-- loading placeholders that are tucked away: not showing -->
<div aria-busy="true" hidden>skeleton</div>
<div aria-hidden="true"><div role="progressbar"></div></div>

<div class="card" id="addr"><b>Deliver to: Home</b><br>12-3 Road No 4, Hyderabad 500034<br><span id="picked">Selected</span></div>
<button type="button" id="change">Change address</button>
<button type="button" id="deliver">Deliver here</button>

<!-- a live ticker and an advert rotating: the page never goes quiet -->
<p>Offer ends in <span id="tick">0</span> ms &middot; <span id="ad">Ad: 10% off</span></p>

<!-- a real spinner, for a while, after pressing the button -->
<button type="button" id="pay">Check availability</button>
<div id="spinwrap"></div>
<p id="result"></p>

<script>
  setInterval(() => { document.getElementById('tick').textContent = String(Date.now() % 100000); }, 60);
  setInterval(() => { document.getElementById('ad').textContent = 'Ad: ' + (10 + (Date.now() % 7)) + '% off'; }, 150);
  document.getElementById('deliver').onclick = () => { window.__delivered = true; document.getElementById('picked').textContent = 'Selected (delivering here)'; };
  document.getElementById('pay').onclick = () => {
    const wrap = document.getElementById('spinwrap');
    wrap.innerHTML = '<div id="spin" role="progressbar" aria-busy="true"></div><span>Checking…</span>';
    setTimeout(() => { wrap.innerHTML = ''; document.getElementById('result').textContent = 'In stock'; }, 7000);
  };
</script>
</body>
</html>
