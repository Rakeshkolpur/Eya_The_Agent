<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<style>body { font-family: sans-serif; margin: 20px; } input, button { font-size: 15px; padding: 6px; margin: 4px 0; display: block; }</style>
</head>
<body>
<h1>Sign in</h1>
<!-- Step 1: the phone number. Step 2: the one-time code that was sent to it (like an e-commerce login). -->
<div id="step1">
  <label>Mobile number <input id="mobile" type="text" autocomplete="tel" aria-label="Mobile number"></label>
  <button id="send" type="button">Request OTP</button>
</div>
<div id="step2" style="display:none">
  <p>We sent a code to your phone.</p>
  <label>Enter OTP <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" aria-label="Enter OTP"></label>
  <label>Account password <input id="pw" type="password" aria-label="Account password"></label>
  <label>Card number <input id="card" type="text" autocomplete="cc-number" aria-label="Card number"></label>
  <button id="verify" type="button">Verify</button>
</div>
<p id="result"></p>
<script>
  document.getElementById('send').addEventListener('click', () => {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = 'block';
  });
  document.getElementById('verify').addEventListener('click', () => {
    const code = document.getElementById('otp').value;
    document.getElementById('result').textContent = code === '482913' ? 'Verified: welcome back' : 'Wrong code: ' + code.length + ' characters';
  });
</script>
</body>
</html>
